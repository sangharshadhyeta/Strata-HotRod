<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" role="img" aria-label="How a requested expert is served: on the card, stand-in, RAM or SSD">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#11161d"/></linearGradient>
    <radialGradient id="dotg"><stop offset="0" stop-color="#fff2d6"/><stop offset="1" stop-color="#ffb054"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7d838e"/></marker>
    <style>
      text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .q{font-size:14px;font-weight:700;fill:#f0f3f6}
      .s{font-size:12px;fill:#9aa3ae}
      .y{font-size:12px;font-weight:700;fill:#aab2bd}
      .box{stroke-width:2}
    </style>
  </defs>
  <rect width="900" height="430" rx="16" fill="url(#bgT)" stroke="#262c36"/>

  <!-- start -->
  <rect x="24" y="170" width="150" height="60" rx="30" fill="#181b22" stroke="#3a3f4a" stroke-width="1.5"/>
  <text x="99" y="196" text-anchor="middle" class="q">Router picks</text>
  <text x="99" y="215" text-anchor="middle" class="s">experts for a word</text>
  <path d="M174 200 H222" stroke="#7d838e" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- decisions across -->
  <path d="M222 200 L292 160 L362 200 L292 240 Z" fill="#12141a" stroke="#ffb054" stroke-width="2"/>
  <text x="292" y="205" text-anchor="middle" class="q">On the card?</text>
  <path d="M362 200 H408" stroke="#7d838e" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="378" y="192" class="y">no</text>
  <path d="M408 200 L498 150 L588 200 L498 250 Z" fill="#12141a" stroke="#ffb054" stroke-width="2"/>
  <text x="498" y="196" text-anchor="middle" class="q">Stand-in OK?</text>
  <text x="498" y="215" text-anchor="middle" class="s">weight × gap ≤ budget</text>
  <path d="M588 200 H634" stroke="#7d838e" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="604" y="192" class="y">no</text>
  <path d="M634 200 L702 160 L770 200 L702 240 Z" fill="#12141a" stroke="#ffb054" stroke-width="2"/>
  <text x="702" y="205" text-anchor="middle" class="q">In RAM?</text>

  <!-- outcomes -->
  <path d="M292 160 V92" stroke="#7d838e" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="302" y="130" class="y">yes</text>
  <rect id="o1" class="box" x="212" y="46" width="160" height="46" rx="12" fill="#231710" stroke="#ff7a30"/>
  <text x="292" y="74" text-anchor="middle" class="q" fill="#ffd9bd">Compute on the card</text>

  <path d="M498 150 V92" stroke="#7d838e" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="508" y="124" class="y">yes</text>
  <rect id="o2" class="box" x="418" y="46" width="160" height="46" rx="12" fill="#231710" stroke="#ff7a30"/>
  <text x="498" y="74" text-anchor="middle" class="q" fill="#ffd9bd">Use closest on card</text>

  <path d="M702 160 V92" stroke="#7d838e" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="712" y="130" class="y">yes</text>
  <rect id="o3" class="box" x="622" y="46" width="160" height="46" rx="12" fill="#1f190f" stroke="#ffb054"/>
  <text x="702" y="74" text-anchor="middle" class="q" fill="#ffe3b8">Read it from RAM</text>

  <path d="M702 240 V300" stroke="#7d838e" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="712" y="276" class="y">no</text>
  <rect id="o4" class="box" x="592" y="302" width="220" height="56" rx="12" fill="#0e1822" stroke="#5fb4ff"/>
  <text x="702" y="326" text-anchor="middle" class="q" fill="#bfe0ff">Read it from the SSD</text>
  <text x="702" y="346" text-anchor="middle" class="s">direct, bypassing the page cache</text>

  <!-- look-ahead -->
  <rect x="236" y="296" width="290" height="68" rx="12" fill="#18160f" stroke="#ffb054" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="381" y="320" text-anchor="middle" class="q" fill="#ffe3b8">Learned look-ahead</text>
  <text x="381" y="340" text-anchor="middle" class="s">guesses the next 1–4 layers</text>
  <text x="381" y="356" text-anchor="middle" class="s">and starts these reads early</text>
  <path d="M526 332 H590" stroke="#ffb054" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)"/>
  <text x="450" y="400" text-anchor="middle" class="s">Close call? The token is run again exactly, without stand-ins.</text>

  <!-- travelling token: four routes, one every 3 s, cycle 12 s -->
  <circle r="7" fill="url(#dotg)" opacity="0">
    <animateMotion dur="12s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.14;1" calcMode="linear" path="M24 200 H99 H292 V74"/>
    <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.01;.14;.16;1"/>
  </circle>
  <circle r="7" fill="url(#dotg)" opacity="0">
    <animateMotion dur="12s" begin="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.2;1" calcMode="linear" path="M24 200 H292 H498 V74"/>
    <animate attributeName="opacity" dur="12s" begin="3s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.01;.2;.22;1"/>
  </circle>
  <circle r="7" fill="url(#dotg)" opacity="0">
    <animateMotion dur="12s" begin="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.25;1" calcMode="linear" path="M24 200 H498 H702 V74"/>
    <animate attributeName="opacity" dur="12s" begin="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.01;.25;.27;1"/>
  </circle>
  <circle r="7" fill="url(#dotg)" opacity="0">
    <animateMotion dur="12s" begin="9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.25;1" calcMode="linear" path="M24 200 H702 V330"/>
    <animate attributeName="opacity" dur="12s" begin="9s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.01;.25;.27;1"/>
  </circle>

  <!-- arrival glow on each outcome -->
  <rect x="212" y="46" width="160" height="46" rx="12" fill="none" stroke="#ff7a30" stroke-width="4" opacity="0"><animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.14;.17;.24;1"/></rect>
  <rect x="418" y="46" width="160" height="46" rx="12" fill="none" stroke="#ff7a30" stroke-width="4" opacity="0"><animate attributeName="opacity" dur="12s" begin="3s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.2;.23;.3;1"/></rect>
  <rect x="622" y="46" width="160" height="46" rx="12" fill="none" stroke="#ffb054" stroke-width="4" opacity="0"><animate attributeName="opacity" dur="12s" begin="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.25;.28;.35;1"/></rect>
  <rect x="592" y="302" width="220" height="56" rx="12" fill="none" stroke="#5fb4ff" stroke-width="4" opacity="0"><animate attributeName="opacity" dur="12s" begin="9s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.25;.28;.35;1"/></rect>
</svg>
